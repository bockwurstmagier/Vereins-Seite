name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prüfen und bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Build/unit checks use no production database. Integration tests need a separate environment.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-test-placeholder

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Next.js-Typen erzeugen
        run: npx next typegen

      - name: TypeScript prüfen
        run: npx tsc --noEmit

      - name: Anwendung bauen
        run: npm run build

      - name: LiveCenter und Aufstellung testen
        run: npm test
